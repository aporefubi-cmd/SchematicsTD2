<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schematic Informer</title>
<style>
:root{--bg:#f3f1ee;--card:#fff;--ink:#1b1b1f;--mute:#6b6b73;--line:#dcd8d2;--acc:#e8620c;--accsoft:#fde6d6;--add:#1f9d55;--rep:#d6336c;--opt:#3b6fd4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1114;--card:#191c21;--ink:#ecebe8;--mute:#8d9099;--line:#2a2e35;--acc:#ff7a1a;--accsoft:#3a2412;--add:#43d17f;--rep:#ff6b9b;--opt:#6f9cff}}
:root[data-theme="dark"]{--bg:#0f1114;--card:#191c21;--ink:#ecebe8;--mute:#8d9099;--line:#2a2e35;--acc:#ff7a1a;--accsoft:#3a2412;--add:#43d17f;--rep:#ff6b9b;--opt:#6f9cff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 8px;max-width:1200px;margin:auto}
h1{margin:0;font-size:22px;letter-spacing:.04em;text-transform:uppercase}h1 span{color:var(--acc)}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.wrap{max-width:1200px;margin:auto;padding:8px 16px 40px;display:grid;grid-template-columns:1fr 330px;gap:16px}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.lbl{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
input[type=search]{flex:1;min-width:140px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.card:hover{border-color:var(--acc)}.card.sel{background:var(--accsoft);outline:2px solid var(--acc)}
.sec{grid-column:1/-1;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-top:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-weight:700;letter-spacing:.03em}.xp{font-size:11px;color:var(--mute);white-space:nowrap}
.meta{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:2px 0 6px}
.slot{font-size:13px;padding:3px 0;border-top:1px dashed var(--line)}
.tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:6px;color:#fff;vertical-align:1px}
.ADD{background:var(--add)}.REP{background:var(--rep)}.OPT{background:var(--opt)}
aside{position:sticky;top:10px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;max-height:calc(100vh - 20px);overflow:auto}
@media(max-width:860px){aside{position:static;max-height:none}}
aside h2{margin:0 0 4px;font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.item{border-top:1px solid var(--line);padding:8px 0;font-size:13px}.item b{letter-spacing:.03em}
.item button{float:right;border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px}
.empty{color:var(--mute);font-size:13px;padding:8px 0}
.act{display:flex;gap:8px;margin-top:10px}.act button{flex:1}

nav{max-width:1200px;margin:auto;padding:4px 16px 0;display:flex;gap:8px}
nav .chip{font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.sc-wrap{max-width:1200px;margin:auto;padding:12px 16px 40px}
.sc-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.prog{font-size:13px;color:var(--mute)}.prog b{color:var(--acc)}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.sc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:12px}
.sc.hvt{border-left-color:var(--rep)}.sc.done{opacity:.55}
.sc h3{margin:0 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sc h3 small{font-size:11px;color:var(--mute);font-weight:400}
.sc.hvt h3 .k{color:var(--rep)}
.ob{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line);font-size:13px;cursor:pointer}
.ob input{margin-top:2px;accent-color:var(--acc);flex:none}
.ob.ck span{text-decoration:line-through;color:var(--mute)}
.fin{margin-top:14px;background:var(--accsoft);border:1px solid var(--acc);border-radius:10px;padding:12px 14px}
.fin .lbl{color:var(--acc)}.fin div.v{font-weight:700;font-size:16px;margin-top:2px}
</style>
<style>
body.locked>*:not(#gate){display:none!important}
#gate{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
body.locked #gate{display:flex}
#gate form{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
#gate input{font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);text-align:center;width:240px;max-width:100%}
#gate input.bad{border-color:var(--rep)}
#gate button{font:inherit;padding:9px 22px;border:0;border-radius:999px;background:var(--acc);color:#fff;font-weight:600;cursor:pointer}
#gate small{color:var(--mute);min-height:1em}
</style>
</head>
<body class="locked">
<div id="gate"><form id="gf"><div style="font-size:40px">🐇</div><input id="gp" type="password" placeholder="Password" autocomplete="off" autofocus><button type="submit">Enter</button><small id="gm"></small></form></div>
<header>
<h1>Schematic <span>Tinkerer</span></h1>
<div class="sub">Filter by Cache Pool and category, tap a card to add it to your build.</div>
</header>
<nav><button class="chip on" id="tabS">Schematics</button><button class="chip" id="tabT">Scouts</button></nav>
<div class="wrap" id="pgS">
<main>
<div class="bar">
<input id="q" type="search" placeholder="Search name or stat (e.g. CHD, HAZPRO)…">
</div>
<div class="bar"><span class="lbl">Cache Pool</span><div class="grp" id="fx"></div></div>
<div class="bar"><span class="lbl">Category</span><div class="grp" id="fc"></div></div>
<div class="bar" id="rowS" style="display:none"><span class="lbl">Type</span><div class="grp" id="fs"></div></div>
<div class="grid" id="grid"></div>
</main>
<aside>
<h2>My build <span id="cnt" class="xp"></span></h2>
<div id="list"></div>
<div class="act"><button class="chip" id="copy">Copy list</button><button class="chip" id="clr">Clear</button></div>
</aside>
</div>
<div class="sc-wrap" id="pgT" style="display:none">
<div class="sc-top"><div class="prog" id="scProg"></div><div class="act" style="margin:0"><button class="chip" id="scReset">Reset progress</button></div></div>
<div class="sc-grid" id="scGrid"></div>
<div class="fin"><span class="lbl">Final mission: possible location</span><div class="v">Capitol Building (Capitol Hill)</div></div>
</div>
<script>
const D=[
["PATCH JOB","StarterGear","Brand","RECAL",["REPLACE 15% SKILL REPAIR"]],
["SHELTER","StarterGear","Brand","RECAL",["REPLACE 7.5 HAZPRO"]],
["PAYOUT","StarterGear","Gear Set","RECAL",["REPLACE 9 CHD"]],
["BOXCARS","StarterGear","Gear Set","RECAL",["REPLACE 4.5 CHC"]],
["VOUCHSAFE","StarterGear","Gear Set","RECAL",["REPLACE 7.5 HAZPRO"]],
["SPITFIRE","StarterWeapons","Weapon","ADD",["ADD 2% ROF"]],
["ROCKSTEADY","StarterWeapons","Weapon","OPTIMIZATION",["VALUE = 75%","VALUE = 75%"]],
["SNIPE HUNT","StarterWeapons","Weapon","RECAL",["REPLACE 7.5 CHD"]],
["BIRDER","StarterWeapons","Weapon","RECAL",["REPLACE 7.2 CHC"]],
["JACKPOT","AdvancedGear","Brand","RECAL",["REPLACE 13.5 CHD","REPLACE 6.8% CHC"]],
["BLAST SHIELD","AdvancedGear","Brand","ADD",["ADD 2.6 EXP RES"]],
["TRIBULATION","AdvancedGear","Brand","ADD",["ADD 2.6 STATUS"]],
["BLACKJACK","AdvancedGear","Gear Set","ADD",["ADD 2.6 CHD"]],
["VIGOR","AdvancedGear","Gear Set","ADD",["ADD HEALTH 4K"]],
["BLUE COLLAR","AdvancedGear","Gear Set","RECAL+OPTI",["REPLACE 3% PFE","INCREASE VALUE 85%"]],
["MARGINS","AdvancedGear","Gear Set","RECAL+OPTI",["REPLACE SKILL EF 3.8","INCREASE VALUE 85%"]],
["RELIANT","AdvancedWeapons","Weapon","RECAL+OPTI",["REPLACE CHD TO 11.3","INCREASE VALUE 85%"]],
["TILT","AdvancedWeapons","Weapon","RECAL+OPTI",["REPLACE CHC TO 10.8%","INCREASE VALUE 85%"]],
["RIFLEMAN","AdvancedWeapons","Weapon","ADD",["ADD CHD 6.8%"]],
["BUZZSAW","AdvancedWeapons","Weapon","ADD + REPLACE",["ADD 10.5% SWAP SPEED","REPLACE STATUS TO 27.0"]],
["KNIGHTSFALL","AdvancedWeapons","Weapon","ADD + OPTIMIZE",["ADD 3.8% DTA","INCREASE VALUE 85%"]],
["EXPOSURE","AdvancedWeapons","Weapon","ADD",["ADD 6.8% DTOC"]],
["CORNUCOPIA","Experimental_B","Weapon","ADD + REPLACE",["ADD 5% ROF","REPLACE MAG SIZE 11%"]],
["BRAINCASE","Experimental_A","Weapon","ADD",["ADD HSD 9%","ADD HSD 9%"]],
["ELEGANCE","Experimental_A","Weapon","ADD",["ADD WH 8%","ADD MAG SIZE 11%"]],
["AFFILICTION","Experimental_B","Weapon","ADD",["ADD 9% STATUS","ADD 9% SE"]],
["CASTIGATION","Experimental_A","Weapon","ADD+REPLACE+OPTIMIZE",["ADD 5% DTA","REPLACE DTOC 15%","VALUE = 100"]],
["WORKING CLASS","Experimental_A","Brand","RECAL",["REPLACE 4% PFE","REPLACE 15 HAZPRO"]],
["SUPERCHARGE","Experimental_B","Gear Set","ADD",["ADD 3.5 SKILL DAMAGE"]],
["NIMBLE","Experimental_B","Gear Set","RECAL",["REPLACE WH 12%","REPLACE HSD 15%"]],
["BACKUP","Experimental_A","Gear Set","ADD + REPLACE",["ADD 7% SKILL REP","REPLACE 5% SKILL EFFICI","VALUE = 100"]],
["APOGEE","Experimental_B","Any","OPTIMIZATION",["VALUE = 85%","VALUE = 85%","VALUE = 85%"]],
["BOUNTIFUL ASSAULT","AdvancedWeapons","Weapon · Assault","ADD + REPLACE",["ADD 10.5% AR DAMAGE","REPLACE MAG SIZE 14%"]],
["SWIFT SUPRESSION","AdvancedWeapons","Weapon · LMG","ADD + REPLACE",["ADD 10.5% LMG DAMAGE","REPLACE MAG SIZE 13.5%"]],
["VIOLENT RUSH","AdvancedWeapons","Weapon · SMG","ADD + REPLACE",["ADD 10.5% SMG DAMAGE","REPLACE CHD 11.3%"]],
["BOUNTIFUL BREACH","AdvancedWeapons","Weapon · Shotgun","ADD + REPLACE",["ADD 10.5% SHOTGUN DAMAGE","REPLACE MAG SIZE 14%"]],
["PRICKLY STING","AdvancedWeapons","Weapon · Rifle","ADD + REPLACE",["ADD 10.5% RIFLE DAMAGE","REPLACE HSD 11.3%"]],
["STEADY PRECISION","AdvancedWeapons","Weapon · MMR","ADD + REPLACE",["ADD 10.5% MMR DAMAGE","REPLACE STAB 13.5%"]],
["VAMPIRE DRAW","AdvancedWeapons","Weapon · Pistol","ADD + REPLACE",["ADD 10.5% PISTOL DAMAGE","REPLACE ARMOR ON KILL 21K"]],
["DEFIANCE","Experimental_A","Weapon","ADD+REPLACE+OPTIMIZE",["ADD 8% PFE","REPLACE 36% HAZPRO","VALUE = 100%"]],
["BRAVE DRAW","Experimental_B","Weapon · Pistol","ADD",["ADD 8% PFE","ADD 9% HSD"]],
["SWIFT ASSAULT","Experimental_A","Weapon · Assault","ADD",["ADD 14% SWAP","ADD 9% HASTE"]],
["HEALTHY SUPRESSION","Experimental_A","Weapon · LMG","ADD",["ADD ARMOR REGEN 4K","ADD 9% HAZPRO"]],
["HAZMAT RUSH","Experimental_A","Weapon · SMG","ADD",["ADD 5% ROF","ADD 9% HAZPRO"]],
["REACHING BREACH","Experimental_B","Weapon · Shotgun","ADD",["ADD 11% RELOAD","ADD 28% RANGE"]],
["PRECISE STING","Experimental_B","Weapon · Rifle","ADD",["ADD 11% ACC","ADD 11% STAB"]],
["FURIOUS PRECISION","Experimental_B","Weapon · MMR","ADD",["ADD 11% ACC","ADD 5% ROF"]],
["LAST BASTION","AdvancedGear","Gear Set · Chest","ADD + REPLACE",["ADD ARMOR 38K","REPLACE INC REP 9.4%"]],
["DEEP POCKETS","AdvancedGear","Gear Set · Backpack","ADD + REPLACE",["ADD ARMOR 38K","REPLACE MAG SIZE 6%"]],
["BLIGHT WARD","AdvancedGear","Gear Set · Mask","ADD + REPLACE",["ADD ARMOR 38K","REPLACE HAZPRO 11.30%"]],
["STEADY GRIP","AdvancedGear","Gear Set · Gloves","ADD + REPLACE",["ADD ARMOR 38K","REPLACE WH 9%"]],
["READY RESPONSE","AdvancedGear","Gear Set · Holster","ADD + REPLACE",["ADD ARMOR 38K","REPLACE SWAP 6.8%"]],
["TUNER","AdvancedGear","Gear Set · Kneepads","ADD + REPLACE",["ADD ARMOR 38K","REPLACE AUG EF 8%"]],
["SAFEGUARD","Experimental_A","Brand","ADD + OPTIMIZE",["ADD 3.5 HAZPRO","VALUE = 100%"]],
["HARVERSTER","Experimental_B","Brand","ADD+REPLACE+OPTIMIZE",["ADD AOK 5K","REPLACE INC REP 12.50%","VALUE = 100%"]],
["OPTIMIZER","Experimental_A","Brand","ADD",["ADD AUG EF 3.5%","ADD 3.5% CHD"]],
["MECHANISM","Experimental_B","Any","OPTIMIZATION",["VALUE = 100%","VALUE = 100%"]]
];
const $=id=>document.getElementById(id);
const st={q:"",x:"all",c:"all",s:"all",sel:new Set()};
try{const s=JSON.parse(localStorage.getItem("rbm")||"[]");s.forEach(n=>st.sel.add(n))}catch(e){}
const save=()=>{try{localStorage.setItem("rbm",JSON.stringify([...st.sel]))}catch(e){}};
const pl=v=>v===null?"—":String(v).replace(/_/g," ").replace(/([a-z])([A-Z])/g,"$1 $2");
const XS=[["all","All"],...["StarterWeapons","StarterGear","AdvancedWeapons","AdvancedGear","Experimental_A","Experimental_B"].map(v=>[v,pl(v)])];
const CS=["all","Brand","Gear Set","Weapon","Any"];
function chips(el,arr,key){el.innerHTML="";arr.forEach(a=>{const [v,l]=Array.isArray(a)?a:[a,a==="all"?"All":a];
const b=document.createElement("button");b.className="chip"+(st[key]===v?" on":"");b.textContent=l;
b.onclick=()=>{st[key]=v;if(key==="c")st.s="all";render()};el.appendChild(b)})}
const tag=s=>s.startsWith("ADD")?"ADD":s.startsWith("REP")?"REP":"OPT";
const tagLbl={ADD:"ADD",REP:"REPL",OPT:"OPT"};
const slotHtml=s=>`<div class="slot"><span class="tag ${tag(s)}">${tagLbl[tag(s)]}</span>${s.replace(/^(ADD|REPLACE|INCREASE)\s*/,"")}</div>`;
const slotHtml2=s=>s.startsWith("VALUE")||s.startsWith("INCREASE")?`<div class="slot"><span class="tag OPT">OPT</span>${s}</div>`:slotHtml(s);
function render(){
chips($("fx"),XS,"x");chips($("fc"),CS,"c");
const subs=st.c==="Weapon"?["Assault","LMG","SMG","Shotgun","Rifle","MMR","Pistol"]:st.c==="Gear Set"?["Chest","Backpack","Mask","Gloves","Holster","Kneepads"]:null;
$("rowS").style.display=subs?"":"none";if(subs)chips($("fs"),["all",...subs],"s");
const q=st.q.toLowerCase();
const rows=D.filter(r=>{
if(st.x==="none"&&r[1]!==null)return false;
if(st.x!=="all"&&st.x!=="none"&&String(r[1])!==st.x)return false;
if(st.c!=="all"&&r[2]!=="Any"&&!r[2].startsWith(st.c))return false;
if(st.s!=="all"&&r[2]!=="Any"&&r[2]!==st.c&&r[2]!==st.c+" · "+st.s)return false;
if(q&&!(r[0]+" "+r[2]+" "+r[4].join(" ")).toLowerCase().includes(q))return false;
return true});
const cardH=r=>`<button class="card${st.sel.has(r[0])?" sel":""}" data-n="${r[0]}">
<div class="top"><span class="nm">${r[0]}</span><span class="xp">${pl(r[1])}</span></div>
<div class="meta">${r[2]} · ${r[3]}</div>${r[4].map(slotHtml2).join("")}</button>`;
const isG=r=>r[2]===st.c||r[2]==="Any";
const gen=st.s==="all"?[]:rows.filter(isG),spec=st.s==="all"?rows:rows.filter(r=>!isG(r));
$("grid").innerHTML=(spec.map(cardH).join("")+(gen.length?`<div class="sec">Works on any ${st.c}</div>`+gen.map(cardH).join(""):""))||'<div class="empty">Nothing matches.</div>';
document.querySelectorAll(".card").forEach(c=>c.onclick=()=>{const n=c.dataset.n;st.sel.has(n)?st.sel.delete(n):st.sel.add(n);save();render()});
const picks=D.filter(r=>st.sel.has(r[0]));
$("cnt").textContent=picks.length?"("+picks.length+")":"";
$("list").innerHTML=picks.length?picks.map(r=>`<div class="item"><button data-r="${r[0]}" title="Remove">×</button><b>${r[0]}</b> <span class="xp">${r[1]===null?"":pl(r[1])}</span><div class="meta" style="margin:0">${r[2]}</div>${r[4].join(" → ")}</div>`).join(""):'<div class="empty">Empty. Tap cards to add them.</div>';
document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{st.sel.delete(b.dataset.r);save();render()});
}
$("q").oninput=e=>{st.q=e.target.value;render()};
$("clr").onclick=()=>{st.sel.clear();save();render()};
$("copy").onclick=()=>{const t=D.filter(r=>st.sel.has(r[0])).map(r=>r[0]+": "+r[4].join(" / ")).join("\n");
try{navigator.clipboard.writeText(t);$("copy").textContent="Copied ✓";setTimeout(()=>$("copy").textContent="Copy list",1200)}catch(e){}};
const SC=[
["Scout 1",0,["Eliminate Hyenas in Downtown West (x10)","Eliminate Outcasts in Constitution Hall (x10)","Eliminate True Sons in Southwest (x10)"]],
["Scout 2",0,["Secure any Control Point in West Potomac Park","Complete Resource Convoys (x2)","Complete Outcast Propaganda Broadcast activities (x2)"]],
["Scout 3",0,["Eliminate Hyenas (x20)","Complete DCD Headquarters on any difficulty","Eliminate named or elite True Sons (x5)"]],
["High-Value Target 1: Gundwin",1,["Eliminate elite Black Tusk (x5)","Destroy Warhound Convoys in West Potomac Park (x2)","Bounty: Gundwin - Eliminate Gundwin in West Potomac Park"]],
["Scout 5",0,["Sell Gear to the vendor at the Campus (x10)","Perform Rescue Operations (x2)","Donate supplies to Control Points (x100)"]],
["Scout 6",0,["Secure Control Points from the Hyenas (x2)","Eliminate named or elite Hyenas (x5)","Complete Jefferson Trade Center on any difficulty"]],
["Scout 7",0,["Prevent Public Executions (x2)","Perform Rescue Operations (x2)","Capture the Sinkhole Control Point"]],
["High-Value Target 2: Odine",1,["Complete Living World activities (x5)","Eliminate Black Tusk (x20)","Bounty: Odine - Eliminate Odine in Southwest"]],
["Scout 9",0,["Complete Propaganda Broadcast activities (x3)","Complete Territory Control activities (x3)","Eliminate hostiles in Federal Triangle (x30)"]],
["Scout 10",0,["Complete True Sons Living World activities (x3)","Eliminate True Sons Assault soldiers (x10)","Complete Space Administration HQ on any difficulty"]],
["Scout 11",0,["Complete Dark Zone extractions in any Dark Zone","Eliminate hostiles in any Dark Zone (x30)","Clear landmarks in any Dark Zone (x3)"]],
["Scout 12",0,["Eliminate Black Tusk Tanks (x3)","Complete Black Tusk invaded missions (x2)","Complete Tidal Basin on any difficulty"]],
["High-Value Target 3: Rother",1,["Eliminate Black Tusk (x15)","Complete a Black Tusk Retaliation","Bounty: Rother - Eliminate Rother in the East Mall"]]
];
const dn=new Set();
try{JSON.parse(localStorage.getItem("rbmSc")||"[]").forEach(k=>dn.add(k))}catch(e){}
const saveSc=()=>{try{localStorage.setItem("rbmSc",JSON.stringify([...dn]))}catch(e){}};
function renderSc(){
let tot=0,ok=0;
$("scGrid").innerHTML=SC.map((m,i)=>{
const all=m[2].every((_,j)=>dn.has(i+"-"+j));
return `<div class="sc${m[1]?" hvt":""}${all?" done":""}"><h3><span class="k">${m[0]}</span><small>${m[2].filter((_,j)=>dn.has(i+"-"+j)).length}/${m[2].length}</small></h3>`+
m[2].map((o,j)=>{const k=i+"-"+j;tot++;if(dn.has(k))ok++;
return `<label class="ob${dn.has(k)?" ck":""}"><input type="checkbox" data-k="${k}"${dn.has(k)?" checked":""}><span>${o}</span></label>`}).join("")+`</div>`}).join("");
$("scProg").innerHTML="Objectives done: <b>"+ok+" / "+tot+"</b>";
document.querySelectorAll("#scGrid input").forEach(c=>c.onchange=()=>{const k=c.dataset.k;c.checked?dn.add(k):dn.delete(k);saveSc();renderSc()});
}
$("scReset").onclick=()=>{dn.clear();saveSc();renderSc()};
function show(p){
const t=p==="scouts";
$("pgS").style.display=t?"none":"";$("pgT").style.display=t?"":"none";
$("tabS").classList.toggle("on",!t);$("tabT").classList.toggle("on",t);
if(t)renderSc();
}
$("tabS").onclick=()=>{location.hash="";show("")};
$("tabT").onclick=()=>{location.hash="scouts";show("scouts")};
window.addEventListener("hashchange",()=>show(location.hash==="#scouts"?"scouts":""));
render();show(location.hash==="#scouts"?"scouts":"");
</script>
<script>
(function(){
var K="whiterabbit",b=document.body;
function ok(){b.classList.remove("locked")}
try{if(sessionStorage.getItem("gate")==="1")ok()}catch(e){}
document.getElementById("gf").onsubmit=function(e){
e.preventDefault();var i=document.getElementById("gp");
if(i.value===K){try{sessionStorage.setItem("gate","1")}catch(x){}ok()}
else{i.classList.add("bad");document.getElementById("gm").textContent="Wrong password";i.value="";i.focus()}
};
})();
</script>
</body>
</html>
